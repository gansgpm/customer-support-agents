# Nginx site for the support desk: https://support.gansgpm.tech -> Streamlit on 127.0.0.1:8501
# Install: see docs/DEPLOY.md. Certbot adds the HTTPS (443) part to this file automatically.
server {
    listen 80;
    listen [::]:80;
    server_name support.gansgpm.tech;

    client_max_body_size 20m;

    location / {
        # password for the whole app (the desk uses your OpenAI key and can send real email / Telegram replies)
        auth_basic "Remya Industries support desk";
        auth_basic_user_file /etc/nginx/.htpasswd-support;

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit talks to the browser over a websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Optional - only if you use WhatsApp (Twilio) webhooks: start them with
    #   docker compose --profile webhooks up -d
    # then remove the # in front of the next block. Twilio cannot send a password, so this path stays open.
    # location /webhooks/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
